<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>yuque-home-vue</title>
    <script>
      // GitHub Pages 不支持 SPA history 回退，深链接会落到这个 404。
      // 做法：把完整路径转发回 index.html，由 vue-router 继续解析。
      // sessionStorage 防止「转发后仍 404」时无限循环，第二次直接回首页。
      var repoPrefix = '/yuque-home-vue/'
      var segment = location.pathname.startsWith(repoPrefix)
        ? location.pathname.slice(repoPrefix.length)
        : location.pathname.replace(/^\//, '')

      if (sessionStorage.getItem('spa-fallback-path') === segment) {
        location.replace(repoPrefix)
      } else {
        sessionStorage.setItem('spa-fallback-path', segment)
        location.replace(repoPrefix + segment + location.search + location.hash)
      }
    </script>
  </head>
  <body></body>
</html>
