<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>yuque-home-vue</title>
    <script>
      // GitHub Pages 不支持 SPA history 回退，深链接会落到这个 404。
      // 做法：把目标路径写入 sessionStorage，然后回到首页，
      // 由应用启动时的 restoreFallbackPath 恢复真实导航（src/router/fallback.ts）。
      var repoPrefix = '/yuque-home-vue/'
      var segment = location.pathname.startsWith(repoPrefix)
        ? location.pathname.slice(repoPrefix.length)
        : location.pathname.replace(/^\//, '')

      // 带扩展名的是静态资源缺失，不做导航劫持
      if (!/\.[a-z0-9]+$/i.test(segment)) {
        try {
          sessionStorage.setItem('spa-fallback-path', segment + location.search + location.hash)
        } catch (e) {
          // 隐私模式等 storage 不可用场景，忽略即可（用户会看到首页）
        }
      }
      location.replace(repoPrefix)
    </script>
  </head>
  <body></body>
</html>
